name: Existing Checkout Payment Core

on:
  pull_request:
    paths:
      - "scripts/checkout/**"
      - "scripts/prepare-build.sh"
      - ".github/workflows/checkout-payments.yml"
  push:
    branches:
      - feature/checkout-payments-only-v1
    paths:
      - "scripts/checkout/**"
      - "scripts/prepare-build.sh"
      - ".github/workflows/checkout-payments.yml"

permissions:
  contents: read

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate calculations and provider security
        run: node --experimental-strip-types --test scripts/checkout/payment-amounts.test.mjs scripts/checkout/mercadopago.test.mjs
