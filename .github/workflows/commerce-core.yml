name: Crazy Commerce core checks

on:
  push:
    branches:
      - feature/crazy-commerce-universal-catalog
    paths:
      - "scripts/commerce/**"
      - "scripts/prepare-build.sh"
      - ".github/workflows/commerce-core.yml"
  pull_request:
    paths:
      - "scripts/commerce/**"
      - "scripts/prepare-build.sh"
      - ".github/workflows/commerce-core.yml"

permissions:
  contents: read

jobs:
  commerce-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate product pricing and Pix adapter
        run: node --experimental-strip-types --test scripts/commerce/catalog.test.mjs scripts/commerce/mercadopago.test.mjs
